# ============================================
# Juicity-RS Release Workflow
# ============================================
# Runs when a GitHub Release is published.
# Orchestrates the reusable workflows:
#   1. build-package.yml — offline source packaging (checked out at the tag)
#   2. build-core.yml    — core targets, with:
#        tag: the exact release tag (baked into `--version` output)
#        sha: the commit the release points to (baked into `--version` output)
#   3. build-gui.yml     — GUI targets (same tag / sha)
# Then attaches all artifacts to the Release.
# ============================================

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: "The tag to release"
        required: true

permissions:
  contents: write

jobs:
  # --------------------------------------------------
  # Package Offline Source Code (at the release tag)
  # --------------------------------------------------
  package:
    name: Package Offline Source Code
    uses: ./.github/workflows/build-package.yml
    with:
      tag: ${{ github.event.inputs.tag }}
    secrets: inherit

  # --------------------------------------------------
  # Build every target via the core build workflow
  # --------------------------------------------------
  build-core:
    name: Build Core Targets
    needs: package
    uses: ./.github/workflows/build-core.yml
    with:
      tag: ${{ github.event.inputs.tag }}
      sha: ${{ github.sha }}
    secrets: inherit

  # --------------------------------------------------
  # Build every target via the GUI build workflow
  # --------------------------------------------------
  build-gui:
    name: Build GUI Targets
    needs: package
    uses: ./.github/workflows/build-gui.yml
    with:
      tag: ${{ github.event.inputs.tag }}
      sha: ${{ github.sha }}
    secrets: inherit

  # --------------------------------------------------
  # Attach all artifacts to the GitHub Release
  # --------------------------------------------------
  publish:
    name: Attach to Release
    needs: [build-core, build-gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Compress artifacts into zip files
        shell: bash
        run: |
          shopt -s globstar
          for dir in artifacts/*/; do
            target_name=$(basename "$dir")
            # The offline source package is already a .tar.gz — skip zipping
            [[ "$target_name" == "juicity-offline-source" ]] && continue
            zipfile="artifacts/${target_name}.zip"
            echo "Creating zip: $zipfile from $dir"
            (cd "$dir" && zip -ry "../../${zipfile}" .)
          done

      - name: Upload to Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Latest_Releases=$(curl -s -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.tag_name')
          Latest_tag=${{ github.event.inputs.tag }}
          if [ "$Latest_Releases" != "$Latest_tag" ]; then
            gh release create "${{ github.event.inputs.tag }}" -t "${{ github.event.inputs.tag }}" --generate-notes
          fi
          gh release upload "${{ github.event.inputs.tag }}"
